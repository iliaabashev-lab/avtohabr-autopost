name: telegram
# 09:00, 13:00, 17:00 по Москве (cron в UTC)
on:
  schedule: [{cron: "0 6,10,14 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node viral-factory/scripts/telegram-post.mjs ${{ github.event_name == 'workflow_dispatch' && 'force-post' || 'post' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Сохранить отметки
        if: always()
        run: |
          git config user.name "autopost"; git config user.email "autopost@users.noreply.github.com"
          git add -A viral-factory marketing
          git diff --cached --quiet || git commit -qm "$GITHUB_WORKFLOW $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 7)); done
          exit 1
