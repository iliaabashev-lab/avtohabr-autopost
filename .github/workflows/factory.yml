name: factory
# 06:00 по Москве: тренды, тексты (GitHub Models, бесплатно), ВК отложенные и статистика
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
    inputs:
      check: {description: "только проверить нейросеть (ничего не публикует)", type: boolean, default: false}
permissions:
  contents: write
  models: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка нейросети
        if: inputs.check
        working-directory: viral-factory
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          node --input-type=module -e "const {llm}=await import('./scripts/lib.mjs'); console.log(await llm('Ты механик автосервиса.', 'Одной фразой: чем опасен скрип тормозов?'))"
      - if: ${{ !inputs.check }}
        working-directory: viral-factory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          timeout 240 node scripts/trend-scout.mjs || echo "::warning::trend-scout.mjs не закончился ($?)"
          timeout 240 node scripts/content-engine.mjs || echo "::warning::content-engine.mjs не закончился ($?)"
          timeout 240 node scripts/threads-drafts.mjs || echo "::warning::threads-drafts.mjs не закончился ($?)"
          timeout 240 node scripts/gen.mjs daily || echo "::warning::gen.mjs daily не закончился ($?)"
          timeout 240 node scripts/vk.mjs schedule || echo "ВК отложенные не прошли"
          timeout 240 node scripts/vk.mjs stats || echo "статистика ВК не прошла"
      - name: Сохранить отметки
        if: ${{ always() && !inputs.check }}
        run: |
          git config user.name "autopost"; git config user.email "autopost@users.noreply.github.com"
          git add -A viral-factory marketing
          git diff --cached --quiet || git commit -qm "$GITHUB_WORKFLOW $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 7)); done
          exit 1
